# GitHub does not re-run ruleset-required workflows when only a pull request's
# title or description is edited. This re-runs the required `Org PR standard`
# check after such an edit, so fixing the description unblocks the PR and
# breaking it blocks again. It runs only trusted code from FantasticDevHQ/.github
# and never checks out or executes pull request code.
name: PR standard re-run
on:
  pull_request_target:
    types: [edited]
permissions:
  actions: write
  contents: read
concurrency:
  group: pr-standard-rerun-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  rerun:
    name: PR standard re-run
    if: github.event.changes.title || github.event.changes.body
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: FantasticDevHQ/.github
          ref: main
          path: standard
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node standard/scripts/rerun-org-pr-standard.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
