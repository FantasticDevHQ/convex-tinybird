name: Release

# Publishes the tagged version to GitHub Packages and creates the GitHub release.
#
# Trigger: push a tag `vX.Y.Z` whose version matches package.json exactly. The workflow refuses
# any mismatch so a tag can never publish a version other than the one the tree declares.
#
# Token: the job's own GITHUB_TOKEN with `packages: write`. No long-lived npm token exists.
# GitHub Packages does not accept npm provenance attestations, so `--provenance` is not used;
# the release is tied to this workflow run through the package's linked repository instead.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@fantastic-dev"
      - name: Require the tag to match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != package.json v${version}" >&2; exit 1; }
          grep -q "^## ${version} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${version}' section" >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # `check` already built dist; skip lifecycle scripts so publish cannot rebuild a different tree.
        run: npm publish --ignore-scripts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {p=1; next} /^## /{p=0} p' CHANGELOG.md > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
