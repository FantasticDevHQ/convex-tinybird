name: Release

# Publishes the tagged version to npmjs.com and creates the GitHub release.
#
# Trigger: push a tag `vX.Y.Z` whose version matches package.json exactly. The workflow refuses
# any mismatch so a tag can never publish a version other than the one the tree declares.
#
# Auth: npm trusted publishing. npmjs.com trusts this repository's `release.yml` (keep the
# filename), and the job exchanges its OIDC token for a one-off publish credential, so no
# long-lived npm token exists. The same OIDC token signs the provenance attestation that ties
# the tarball to this run and commit. Trusted publishing needs npm >= 11.5.1.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # trusted publishing + provenance

concurrency:
  group: release-${{ github.ref }}

jobs:
  publish:
    name: Publish ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Require the tag to match package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(node -p 'require("./package.json").version')"
          test "v${version}" = "${TAG}" || { echo "tag ${TAG} != package.json v${version}" >&2; exit 1; }
          grep -q "^## ${version} " CHANGELOG.md || { echo "CHANGELOG.md has no '## ${version}' section" >&2; exit 1; }
      - name: Require npm with trusted publishing
        run: |
          set -euo pipefail
          node -e 'const [a,b,c]=process.argv[1].split(".").map(Number); process.exit(a>11||(a===11&&(b>5||(b===5&&c>=1)))?0:1)' "$(npm --version)" \
            || { echo "npm $(npm --version) is older than 11.5.1, which trusted publishing needs" >&2; exit 1; }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Publish to npm
        # `check` already built dist; skip lifecycle scripts so publish cannot rebuild a different tree.
        # Registry, public access and provenance come from package.json `publishConfig`.
        run: npm publish --ignore-scripts
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## " v " " {p=1; next} /^## /{p=0} p' CHANGELOG.md > release-notes.md
          gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
