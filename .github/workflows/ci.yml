name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Package checks
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Build, pack check, typecheck, tests, boundary, secret scan, codegen freshness, README
      # samples, gate self-tests, and the example app's typecheck and tests.
      - name: Verify upstream toolkit export
        run: |
          git clone https://github.com/FantasticDevHQ/convex-worktrees.git "$RUNNER_TEMP/toolkit"
          git -C "$RUNNER_TEMP/toolkit" checkout 52c0b76d960a98afedd48607d6737bc14a954c1e
          cd "$RUNNER_TEMP/toolkit"
          node scripts/check.mjs
      - run: pnpm run check

  example-demo:
    name: Example demo (browser)
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir example exec playwright install --with-deps chromium
      # The launcher deploys example/tinybird into Tinybird Local with the Tinybird CLI.
      - run: pipx install tinybird
      # scripts/dev.mjs starts Tinybird Local in Docker (available on this runner), deploys the
      # example's datasources and pipes, configures the local Convex deployment, starts Vite,
      # and the test drives the page until Tinybird's own numbers move.
      - run: pnpm --dir example run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: example-demo-screenshot
          path: |
            example/e2e/output/
            example/playwright-report/
          if-no-files-found: ignore

  clean-consumer:
    name: Independent consumer
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Installs the packed tarball and convex into a temporary app outside the workspace, runs
      # anonymous local codegen, typecheck and a stubbed-delivery test.
      - run: bash scripts/clean-consumer.sh

  worktree-isolation:
    name: Real worktree isolation
    runs-on: ubicloud-standard-2-ubuntu-2404
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Verify real app backends
        run: pnpm run test:worktree:integration
        env:
          NODE_OPTIONS: --max-old-space-size=512
      - name: Runner identity
        if: always()
        run: |
          echo "Runner $RUNNER_NAME ($RUNNER_OS/$RUNNER_ARCH)"
          uname -a
